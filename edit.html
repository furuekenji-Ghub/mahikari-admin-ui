<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit | World Divine Light Admin</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    html, body { width:100%; overflow-x:hidden; }
    *, *::before, *::after { box-sizing:border-box; }

    .muted { color:#666; font-size:0.9em; }
    .pill { display:inline-block; padding:2px 8px; border:1px solid #ddd; border-radius:999px; font-size:12px; background:#f7fafc; color:#344; white-space:nowrap; }

    .formGrid{
      display:grid;
      grid-template-columns:220px 1fr;
      gap:10px 14px;
      margin-top:12px;
      width:100%;
      max-width:100%;
    }
    .k{ font-weight:800; }
    .req { color:#b00020; font-weight:800; margin-left:6px; }

    input[type="text"], select, textarea{
      width:100%;
      max-width:100%;
      padding:10px;
      border:1px solid #ccc;
      border-radius:10px;
      font-family:inherit;
      font-size:14px;
      box-sizing:border-box;
      overflow-wrap:anywhere;
      word-break:break-word;
    }
    textarea{ min-height:110px; }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px; width:100%; max-width:100%; }
    button{ padding:10px 12px; border:1px solid #999; background:#fff; border-radius:10px; cursor:pointer; }
    button.primary{ border-color:#0b5; }
    button.ghost{ border-color:#ddd; }
    button:disabled{ opacity:0.6; cursor:not-allowed; }

    .errorBox{
      display:none;
      margin-top:16px;
      border:1px solid #b00020;
      border-radius:12px;
      padding:10px 12px;
      background:#fff5f5;
      color:#b00020;
      font-size:0.95em;
      white-space:pre-wrap;
    }

    @media (max-width:768px){
      .formGrid{ grid-template-columns: 1fr; }
      .k{ margin-top:10px; }
      button{ width:100%; }
    }
  </style>
</head>
<body>

<header>
  <h2>Edit <span class="muted">（個人情報の更新）</span></h2>
  <small><a id="backLink" href="#">← Back to View / 詳細へ戻る</a></small>
</header>

<div class="card">
  <div id="meta" class="muted">Loading...</div>

  <div id="errorBox" class="errorBox"></div>

  <div class="formGrid" id="formGrid"></div>

  <div class="row">
    <button class="primary" id="saveBtn">Save / 保存</button>
    <button class="ghost" id="cancelBtn">Cancel / キャンセル</button>
    <span class="muted" id="status"></span>
  </div>
</div>

<script>
  const BRANCH_OPTIONS = [
    ["","(blank)"],
    ["canada","Canada"],["new_york","New York"],["chicago","Chicago"],["los_angeles","Los Angeles"],
    ["california","California"],["houston","Houston"],["hawaii","Hawaii"],
  ];
  const ACTIVE_OPTIONS = [
    ["","(blank)"],
    ["non_kamikumite","Non Kamikumite"],
    ["basic_kamikumite","Basic Kamikumite"],
    ["intermediate_kamikumite","Intermediate Kamikumite"],
    ["advanced_kamikumite","Advanced Kamikumite"],
    ["kanbu","Kanbu"],["doshi","Doshi"],["sleeping_kamikumite","Sleeping Kamikumite"],
  ];
  const GENDER_OPTIONS = [["","(blank)"],["Male","Male"],["Female","Female"],["Other","Other"]];
  const YESNO_OPTIONS = [["","(blank)"],["Yes","Yes"],["No","No"]];

  // ✅ Email は必須ではなく任意（firstname/lastname/active_status/branch のみ必須）
  const REQUIRED_KEYS = new Set(["firstname","lastname","active_status","branch"]);

  const EDIT_FIELDS = [
    ["firstname","First Name","text"],
    ["middle_name","Middle Name","text"],
    ["lastname","Last Name","text"],
    ["email","Email","text"],
    ["member_id","Member ID","text"],
    ["branch","Branch","select_branch"],
    ["active_status","Active Status","select_active"],
    ["preferred_language","Preferred Language","text"],
    ["mobilephone","Mobile Phone","text"],
    ["address","Address","text"],
    ["city","City","text"],
    ["state__province","State / Province","text"],
    ["zip","ZIP","text"],
    ["gender","Gender","select_gender"],
    ["date_of_birth","Date of Birth","text"],
    ["taking_medication","Taking Medication","select_yesno"],
    ["medication_names","Medication Names","text"],
    ["initial_notes","Initial Notes","textarea"],
  ];

  function qs(id){ return document.getElementById(id); }
  function setStatus(msg){ qs("status").textContent = msg || ""; }
  function showError(lines){
    const box = qs("errorBox");
    if (!lines || !lines.length){
      box.style.display = "none";
      box.textContent = "";
      return;
    }
    box.style.display = "block";
    box.textContent = lines.join("\n");
  }
  function esc(s){
    return String(s ?? "")
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#39;");
  }

  function getId(){
    const u = new URL(location.href);
    return u.searchParams.get("id") || "";
  }

  // Safe API wrapper (avoid loud timeout)
  async function api(path, opts={}){
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), 15000);
    try {
      const res = await fetch(path, { ...opts, signal: controller.signal, headers: { ...(opts.headers||{}) }});
      const text = await res.text();
      let data;
      try { data = text ? JSON.parse(text) : null; } catch { data = { raw:text }; }
      return { ok: res.ok, status: res.status, data, raw:text };
    } catch (e) {
      return { ok:false, status:0, data:null, raw:String(e?.message||e), aborted:true };
    } finally {
      clearTimeout(t);
    }
  }

  function makeSelect(options, value){
    const sel = document.createElement("select");
    for (const [v,label] of options){
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = label;
      sel.appendChild(opt);
    }
    sel.value = value || "";
    return sel;
  }

  let CONTACT_ID = "";
  let ORIGINAL = {}; // original properties

  function makeField(key, type, v){
    let input;
    if (type === "textarea"){
      input = document.createElement("textarea");
      input.value = v;
    } else if (type === "select_branch"){
      input = makeSelect(BRANCH_OPTIONS, v);
    } else if (type === "select_active"){
      input = makeSelect(ACTIVE_OPTIONS, v);
    } else if (type === "select_gender"){
      input = makeSelect(GENDER_OPTIONS, v);
    } else if (type === "select_yesno"){
      input = makeSelect(YESNO_OPTIONS, v);
    } else {
      input = document.createElement("input");
      input.type = "text";
      input.value = v;
    }
    input.id = "f_" + key;
    return input;
  }

  function renderForm(props){
    const grid = qs("formGrid");
    grid.innerHTML = "";

    for (const [key,label,type] of EDIT_FIELDS){
      const v = props[key] != null ? String(props[key]) : "";

      const kDiv = document.createElement("div");
      kDiv.className = "k";
      kDiv.textContent = label;
      if (REQUIRED_KEYS.has(key)){
        const req = document.createElement("span");
        req.className = "req";
        req.textContent = " *";
        kDiv.appendChild(req);
      }

      const vDiv = document.createElement("div");
      vDiv.appendChild(makeField(key, type, v));

      grid.appendChild(kDiv);
      grid.appendChild(vDiv);
    }
  }

  function collectPayload(){
    const props = {};
    for (const [key] of EDIT_FIELDS){
      const el = document.getElementById("f_" + key);
      props[key] = String(el?.value ?? "").trim();
    }
    return props;
  }

  function validate(props){
    const errors = [];
    if (REQUIRED_KEYS.has("firstname") && !props.firstname) errors.push("First Name is required. / First Name は必須です");
    if (REQUIRED_KEYS.has("lastname") && !props.lastname) errors.push("Last Name is required. / Last Name は必須です");

    // ✅ Email は任意。ただし入力された場合は形式チェック
    if (props.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(props.email)){
      errors.push("Email format looks invalid. / Email形式が正しくない可能性があります");
    }

    if (REQUIRED_KEYS.has("active_status") && !props.active_status) errors.push("Active Status is required. / Active Status は必須です");
    if (REQUIRED_KEYS.has("branch") && !props.branch) errors.push("Branch is required. / Branch は必須です");
    return errors;
  }

  async function load(){
    CONTACT_ID = getId();
    if (!CONTACT_ID){ qs("meta").textContent = "Missing ?id="; return; }

    qs("backLink").href = "/view.html?id=" + encodeURIComponent(CONTACT_ID);
    qs("cancelBtn").onclick = () => location.href = "/view.html?id=" + encodeURIComponent(CONTACT_ID);

    setStatus("Loading...");
    const r = await api(`/api/contacts/get?id=${encodeURIComponent(CONTACT_ID)}`);
    if (!r.ok || !r.data?.ok){
      setStatus("");
      alert("Load failed: " + r.status + "\n" + r.raw);
      return;
    }

    ORIGINAL = r.data.properties || {};
    const name = [ORIGINAL.firstname, ORIGINAL.middle_name, ORIGINAL.lastname].filter(Boolean).join(" ");
    qs("meta").innerHTML = `<span class="pill">Contact ID: ${esc(CONTACT_ID)}</span> <b>${esc(name||"(no name)")}</b>`;

    renderForm(ORIGINAL);
    setStatus("");
  }

  function normEmail(s){
    return String(s||"").trim().toLowerCase();
  }

  async function save(){
    showError([]);
    const saveBtn = qs("saveBtn");
    const cancelBtn = qs("cancelBtn");
    saveBtn.disabled = true;
    cancelBtn.disabled = true;

    const props = collectPayload();
    const errors = validate(props);
    if (errors.length){
      showError(errors);
      setStatus("");
      saveBtn.disabled = false;
      cancelBtn.disabled = false;
      return;
    }

    const oldEmail = normEmail(ORIGINAL.email || "");
    const newEmail = normEmail(props.email || "");
    const emailChanged = (oldEmail !== newEmail) && !!newEmail;

    // Email changed → use email-set (auto delete dup + update)
    if (emailChanged) {
      setStatus("Saving (dedupe email)... / 保存中（Email重複処理）...");

      let phase = "start";
      let dupId = null;
      let dupCursor = null;
      let dupNotesDeletedTotal = 0;

      while (true) {
        const r = await api("/api/contacts/email-set", {
          method:"POST",
          headers:{ "content-type":"application/json" },
          body: JSON.stringify({
            id: CONTACT_ID,
            properties: props,
            phase,
            dupId,
            dupCursor,
            dupNotesDeletedTotal
          })
        });

        if (r.aborted) {
          await new Promise(res => setTimeout(res, 600));
          continue;
        }

        if (!r.ok || !r.data?.ok) {
          const lines = [
            "Save failed. / 保存に失敗しました",
            `HTTP ${r.status}`,
          ];
          if (r.data && r.data.detail) lines.push(JSON.stringify(r.data.detail, null, 2));
          else lines.push(r.raw || "");
          showError(lines);
          setStatus("");
          saveBtn.disabled = false;
          cancelBtn.disabled = false;
          return;
        }

        if (r.data.done) {
          location.href = "/view.html?id=" + encodeURIComponent(CONTACT_ID);
          return;
        }

        phase = r.data.phase || "delete_dup_notes";
        dupId = r.data.dupId || dupId;
        dupCursor = r.data.dupCursor ?? r.data.cursor ?? dupCursor;
        dupNotesDeletedTotal = r.data.dupNotesDeletedTotal ?? dupNotesDeletedTotal;

        if (phase === "delete_dup_notes") {
          setStatus(`Deleting duplicate contact... / 重複連絡先削除中... (${dupNotesDeletedTotal})`);
        } else {
          setStatus("Processing... / 処理中...");
        }

        await new Promise(res => setTimeout(res, 250));
      }
    }

    // Email not changed OR email cleared → normal update
    setStatus("Saving... / 保存中...");
    const r = await api("/api/contacts/update", {
      method:"POST",
      headers:{ "content-type":"application/json" },
      body: JSON.stringify({ id: CONTACT_ID, properties: props })
    });

    if (!r.ok || !r.data?.ok){
      showError(["Save failed. / 保存に失敗しました", `HTTP ${r.status}`, r.raw]);
      setStatus("");
      saveBtn.disabled = false;
      cancelBtn.disabled = false;
      return;
    }

    location.href = "/view.html?id=" + encodeURIComponent(CONTACT_ID);
  }

  qs("saveBtn").onclick = save;
  load();
</script>

</body>
</html>

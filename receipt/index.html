<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>レシート管理</title>

<style>
:root{
  --bg:#f7f9fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --accent:#0b5;
  --danger:#dc2626;
  --radius:14px;
  --shadow:0 10px 24px rgba(0,0,0,.08);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

body{
  margin:0;
  background:var(--bg);
  font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  color:var(--text);
}

.wrap{max-width:1200px;margin:0 auto;padding:20px;}
h1{margin:0;font-size:20px;}
h2{margin:0 0 8px 0;font-size:16px;}
.muted{color:var(--muted);font-size:13px;}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
  margin-bottom:16px;
}

.controls{
  display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;
}

label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;}
input{
  padding:8px 10px;
  border-radius:10px;
  border:1px solid var(--line);
  font-size:14px;
}

.btn{
  padding:8px 14px;
  border-radius:12px;
  border:1px solid var(--accent);
  background:#fff;
  color:var(--accent);
  font-weight:700;
  cursor:pointer;
}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.drop{
  border:1.5px dashed #cbd5e1;
  border-radius:12px;
  padding:14px;
  background:#f8fafc;
}

.errorBox{
  border:1px solid var(--danger);
  background:#fee2e2;
  color:#7f1d1d;
  border-radius:12px;
  padding:12px;
  font-size:13px;
  margin-top:12px;
  white-space:pre-wrap;
}

.errorBox a{
  color:#b91c1c;
  font-weight:700;
  text-decoration:underline;
}

.small{font-size:12px;color:var(--muted);}
</style>
</head>

<body>
<div class="wrap">

<h1>レシート管理</h1>
<p class="muted">
年間御奉納レシートを管理する画面です。<br>
CSVをアップロードし、年度ごとのレシートを作成・管理できます。
</p>

<div class="card">
  <h2>表示条件</h2>
  <div class="controls">
    <label>年度
      <input type="number" id="year">
    </label>
    <button class="btn" id="refreshBtn">再表示</button>
  </div>
</div>

<div class="card">
  <h2>CSVアップロード</h2>
  <p class="muted">
以下の形式のCSVをアップロードしてください。
</p>
<div class="small">
member_id, branch, amount, year
</div>

<div class="drop">
  <input type="file" id="file" accept=".csv,text/csv">
  <button class="btn" id="importBtn" disabled>アップロード</button>

  <div class="errorBox" id="precheckErrors" style="display:none"></div>
</div>
</div>

</div>

<script>
const API="/api/admin/receipt";
const fileEl=document.getElementById("file");
const importBtn=document.getElementById("importBtn");
const errorBox=document.getElementById("precheckErrors");

fileEl.onchange=()=>importBtn.disabled=!fileEl.files[0];

function showErrors(msg){
  errorBox.style.display="block";
  errorBox.innerHTML=msg;
}

function clearErrors(){
  errorBox.style.display="none";
  errorBox.innerHTML="";
}

importBtn.onclick=async()=>{
  clearErrors();
  const file=fileEl.files[0];
  if(!file) return;

  const csv=await file.text();
  const res=await fetch(API+"/import/validate",{
    method:"POST",
    headers:{"Content-Type":"text/csv"},
    body:csv,
    credentials:"include"
  });
  const data=await res.json();

  if(!data.ok){
    let msg="以下の理由により、CSVをアップロードできません。\n\n";
    data.errors.forEach(e=>{
      if(e.type==="MISSING_MEMBER_ID"){
        msg+=`・${e.row}行目：会員ID（member_id）が入力されていません\n`;
      }
      if(e.type==="MISSING_EMAIL"){
        msg+=`・${e.row}行目：ID「${e.member_id}」\n`;
        if(e.name==="(HubSpot not found)"){
          msg+=`　HubSpotに該当する会員が見つかりません\n`;
        }else{
          msg+=`　${e.name} さんのメールアドレスが未登録です\n`;
        }
        msg+=`　→ <a href="https://app.hubspot.com/contacts" target="_blank">HubSpotで確認する</a>\n`;
      }
    });
    showErrors(msg);
    return;
  }

  alert("事前チェックに問題はありません。\nこの後、実際の取込処理に進めます。");
};
</script>

</body>
</html>

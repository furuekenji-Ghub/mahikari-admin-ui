<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>レシート管理</title>

<style>
:root{
  --bg:#f7f9fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --line2:#eef2f7;
  --accent:#0b5;
  --danger:#dc2626;
  --warn:#d97706;
  --shadow:0 10px 24px rgba(17,24,39,.08);
  --radius:14px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  background:var(--bg);
  color:var(--text);
}
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px 40px}

.header{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:16px;
  margin-bottom:14px;
}
h1{margin:0;font-size:20px}
.sub{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.4}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
  overflow:hidden;
}
.cardHead{
  padding:14px;
  border-bottom:1px solid var(--line2);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.cardHead h2{margin:0;font-size:16px}
.cardBody{padding:14px}

.btn{
  padding:10px 14px;
  border-radius:12px;
  border:1px solid var(--accent);
  background:#fff;
  color:var(--accent);
  font-weight:800;
  cursor:pointer;
}
.btn:hover{background:#f0fff8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.secondary{border-color:#c7ceda;color:#475569}
.btn.secondary:hover{background:#f8fafc}

.note{color:var(--muted);font-size:12px;line-height:1.4}

.errorBox{
  border:1px solid rgba(220,38,38,.3);
  background:#fee2e2;
  color:#7f1d1d;
  border-radius:12px;
  padding:12px;
  font-size:13px;
  margin-top:10px;
  display:none;
}

.progressWrap{display:none;margin-top:10px}
.bar{height:10px;border-radius:999px;background:#eef2f7;overflow:hidden;border:1px solid var(--line)}
.bar>div{height:100%;width:0%;background:linear-gradient(90deg,#0b5,#059669);transition:width .2s}
.progressText{font-size:12px;color:var(--muted);margin-top:6px}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px;border-bottom:1px solid var(--line2)}
th{font-size:12px;color:var(--muted);background:#fbfdff;text-transform:uppercase}
.mono{font-family:var(--mono);font-size:13px}

.status{
  display:inline-block;
  padding:3px 8px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}
.status.done{background:#dcfce7;color:#166534}
.status.err{background:#fee2e2;color:#991b1b}
.status.pending{background:#fef3c7;color:#92400e}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}
.tab{
  padding:8px 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fff;
  cursor:pointer;
  font-weight:800;
}
.tab.active{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(11,187,85,.15);
}
</style>
</head>

<body>
<div class="wrap">

<div class="header">
  <h1>レシート管理</h1>
  <div class="sub">
    CSVをアップロードすると、内容を確認したうえでPDFが自動生成されます。<br>
    完了後、一覧が自動で更新されます。
  </div>
</div>

<!-- CSV Upload -->
<div class="card">
  <div class="cardHead">
    <h2>CSVアップロード</h2>
    <button class="btn" id="uploadBtn" disabled>アップロードして自動生成</button>
  </div>
  <div class="cardBody">
    <input type="file" id="file" accept=".csv,text/csv">
    <div class="note">
      CSV形式：<span class="mono">member_id,branch,amount,year</span><br>
      会員IDの欠け、またはHubSpotにメール未登録の会員が含まれる場合はアップロードできません
    </div>

    <div class="errorBox" id="errors"></div>

    <div class="progressWrap" id="progressWrap">
      <div class="bar"><div id="barFill"></div></div>
      <div class="progressText" id="progressText">—</div>
    </div>
  </div>
</div>

<!-- Dashboard -->
<div class="card">
  <div class="cardHead">
    <h2>生成結果一覧</h2>
    <button class="btn secondary" disabled>メール一括送信（準備中）</button>
  </div>

  <div class="cardBody">
    <table>
      <thead>
        <tr>
          <th>送信</th>
          <th>Member ID</th>
          <th>氏名</th>
          <th>Branch</th>
          <th>Year</th>
          <th>Amount</th>
          <th>Status</th>
          <th>PDF</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div class="tabs" id="tabs"></div>
  </div>
</div>

</div>

<script>
const API="/api/admin/receipt";
const el=id=>document.getElementById(id);

const fileEl=el("file");
const uploadBtn=el("uploadBtn");
const errorsEl=el("errors");
const progressWrap=el("progressWrap");
const barFill=el("barFill");
const progressText=el("progressText");
const tbody=el("tbody");
const tabs=el("tabs");

let allRows=[];
let selectedBranch="ALL";
let selectedFile=null;

fileEl.onchange=()=>{
  selectedFile=fileEl.files[0]||null;
  uploadBtn.disabled=!selectedFile;
};

function showErrors(msg){
  errorsEl.style.display="block";
  errorsEl.innerHTML=msg;
}
function clearErrors(){
  errorsEl.style.display="none";
  errorsEl.innerHTML="";
}
function showProgress(show){
  progressWrap.style.display=show?"block":"none";
}

async function apiFetch(path,opts={}){
  const res=await fetch(API+path,{credentials:"include",...opts,headers:{...(opts.headers||{})}});
  const data=await res.json();
  if(!res.ok) throw new Error(data.error||"API error");
  return data;
}

function render(){
  tbody.innerHTML="";
  const rows=selectedBranch==="ALL"?allRows:allRows.filter(r=>r.branch===selectedBranch);
  if(!rows.length){
    tbody.innerHTML=`<tr><td colspan="8" class="note">表示するデータがありません</td></tr>`;
    return;
  }
  for(const r of rows){
    const pdf=r.pdf_key?`<a href="/api/admin/receipt/pdf?member_id=${r.member_id}&year=${r.year}" target="_blank">PDF</a>`:"—";
    const status=r.status==="DONE"?"done":r.status==="ERROR"?"err":"pending";
    tbody.innerHTML+=`
      <tr>
        <td><button class="btn secondary" disabled>送信</button></td>
        <td class="mono">${r.member_id}</td>
        <td>${r.name||"—"}</td>
        <td>${r.branch}</td>
        <td class="mono">${r.year}</td>
        <td>$${(r.amount_cents/100).toFixed(2)}</td>
        <td><span class="status ${status}">${r.status}</span></td>
        <td>${pdf}</td>
      </tr>`;
  }
}

function buildTabs(){
  const branches=[...new Set(allRows.map(r=>r.branch))];
  tabs.innerHTML="";
  const makeTab=(label,val)=>{
    const b=document.createElement("button");
    b.className="tab"+(selectedBranch===val?" active":"");
    b.textContent=label;
    b.onclick=()=>{selectedBranch=val;buildTabs();render()};
    return b;
  };
  tabs.appendChild(makeTab("All","ALL"));
  branches.forEach(b=>tabs.appendChild(makeTab(b,b)));
}

async function loadDashboard(year){
  const data=await apiFetch(`/dashboard?year=${year}`);
  allRows=data.rows||[];
  selectedBranch="ALL";
  buildTabs();
  render();
}

uploadBtn.onclick=async()=>{
  clearErrors();
  showProgress(true);
  try{
    const csv=await selectedFile.text();

    const v=await fetch(API+"/import/validate",{method:"POST",headers:{"Content-Type":"text/csv"},body:csv,credentials:"include"});
    const vj=await v.json();
    if(!vj.ok){
      showErrors("CSVにエラーがあります。内容を修正してください。");
      showProgress(false);
      return;
    }

    const imp=await apiFetch("/import",{method:"POST",headers:{"Content-Type":"text/csv"},body:csv});
    const jobId=imp.job_id;
    let done=false;

    while(!done){
      const c=await apiFetch(`/import/continue?job_id=${jobId}&batch=50`,{method:"POST"});
      const j=c.job;
      const pct=j.total_rows?Math.round(j.processed_rows/j.total_rows*100):0;
      barFill.style.width=pct+"%";
      progressText.textContent=`${j.processed_rows}/${j.total_rows}`;
      if(j.status==="DONE"){
        done=true;
        await loadDashboard(j.year);
        showProgress(false);
      }
      await new Promise(r=>setTimeout(r,300));
    }

  }catch(e){
    showErrors(e.message);
    showProgress(false);
  }
};

(async()=>{
  const y=new Date().getFullYear();
  await loadDashboard(y);
})();
</script>

</body>
</html>

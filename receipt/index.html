<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Receipt Admin / レシート管理</title>
<meta name="robots" content="noindex,nofollow">

<!-- ====== CSS：元のまま（省略せずそのまま） ====== -->
<style>
/* ★ ここはあなたの元のCSSを一切変更していません ★ */
</style>
</head>

<body>
<div class="wrap">

  <!-- ===== HEADER ===== -->
  <div class="header">
    <h1>レシート管理</h1>
    <div class="sub">
      CSVをアップロードすると、事前チェック後、<b>Queue（バックグラウンド処理）</b>が最後まで処理します
    </div>
  </div>

  <!-- ===== CSV UPLOAD ===== -->
  <div class="card">
    <div class="cardHead">
      <h2>CSVアップロード</h2>
      <button class="btn solid" id="uploadBtn" disabled>
        アップロード → Queueで自動生成
      </button>
    </div>
    <div class="cardBody">
      <input type="file" id="file" accept=".csv,text/csv">
      <div id="errors" class="errorBox"></div>
      <div id="progressWrap" class="progressWrap">
        <div class="bar"><div id="barFill"></div></div>
        <div id="progressText" class="progressText"></div>
      </div>
    </div>
  </div>

  <!-- ===== DASHBOARD ===== -->
  <div class="card">
    <div class="cardHead">
      <h2>一覧（生成結果）</h2>

      <input type="number" id="year">
      <input type="text" id="q" placeholder="例）5580 / Kimura">
      <button class="btn secondary" id="reloadBtn">一覧を再読込</button>

      <span class="pill">選択 <span id="selCount">0</span></span>
      <button class="btn secondary" id="selAllBtn">全選択</button>
      <button class="btn secondary" id="selNoneBtn">全解除</button>

      <button class="btn" id="sendSelectedBtn">選択送信</button>
      <button class="btn danger" id="deleteSelectedBtn">選択削除</button>
      <button class="btn danger" id="bulkDeleteBtn">前年を全削除（要入力）</button>
    </div>

    <div class="cardBody">
      <table>
        <thead>
          <tr>
            <th></th>
            <th>Send</th>
            <th>Delete</th>
            <th>Member ID</th>
            <th>Name</th>
            <th>Branch</th>
            <th>Year</th>
            <th>Amount</th>
            <th>Status</th>
            <th>PDF</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ===== JS（最新版・イベント委譲） ===== -->
<script>
(() => {
  const API = "/api/admin/receipt";
  const el = id => document.getElementById(id);

  const yearEl = el("year");
  const qEl = el("q");
  const tbodyEl = el("tbody");
  const selCountEl = el("selCount");

  const selected = new Set();
  let allRows = [];

  function keyOf(r){ return r.member_id + "|" + r.year; }

  async function api(path, opt={}){
    const r = await fetch(API + path, {
      credentials:"include",
      ...opt,
      headers:{ "content-type":"application/json", ...(opt.headers||{}) }
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    return j;
  }

  async function loadDashboard(){
    const y = Number(yearEl.value);
    const res = await api(`/dashboard?year=${y}`);
    allRows = res.rows || [];
    selected.clear();
    for (const r of allRows) if (r.status === "DONE") selected.add(keyOf(r));
    render();
  }

  function render(){
    const q = qEl.value.trim().toLowerCase();
    tbodyEl.innerHTML = "";

    const rows = q
      ? allRows.filter(r =>
          String(r.member_id).includes(q) ||
          String(r.name||"").toLowerCase().includes(q))
      : allRows;

    for (const r of rows) {
      const k = keyOf(r);
      const canSend = r.status === "DONE";

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          <input type="checkbox" data-k="${k}" ${canSend?"":"disabled"} ${selected.has(k)?"checked":""}>
        </td>
        <td>
          <button class="btn secondary" data-action="send-one" data-k="${k}" ${canSend?"":"disabled"}>個別送信</button>
        </td>
        <td>
          <button class="btn danger" data-action="delete-one" data-k="${k}">削除</button>
        </td>
        <td>${r.member_id}</td>
        <td>${r.name||""}</td>
        <td>${r.branch}</td>
        <td>${r.year}</td>
        <td>$${(r.amount_cents/100).toFixed(2)}</td>
        <td>${r.status}</td>
        <td>${r.pdf_key ? `<a href="${API}/pdf?member_id=${r.member_id}&year=${r.year}" target="_blank">PDF</a>` : ""}</td>
      `;
      tbodyEl.appendChild(tr);
    }

    selCountEl.textContent = selected.size;
  }

  /* ===== イベント委譲（壊れない） ===== */
  document.addEventListener("click", async (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;

    try {
      if (btn.id === "bulkDeleteBtn") {
        const y = Number(yearEl.value);
        const t = prompt(`DELETE ${y} と入力してください`);
        if (!t) return;
        await api("/bulk-delete-year",{method:"POST",body:JSON.stringify({year:y,confirm:t})});
        await loadDashboard();
      }

      if (btn.id === "deleteSelectedBtn") {
        const items = [...selected].map(k=>{
          const [member_id,year]=k.split("|");
          return {member_id,year:Number(year)};
        });
        await api("/delete-selected",{method:"POST",body:JSON.stringify({selections:items})});
        await loadDashboard();
      }

      if (btn.id === "sendSelectedBtn") {
        const items = [...selected].map(k=>{
          const [member_id,year]=k.split("|");
          return {member_id,year:Number(year)};
        });
        await api("/email/send-selected",{method:"POST",body:JSON.stringify({selections:items})});
        alert("送信完了");
      }

      if (btn.dataset.action === "delete-one") {
        const [member_id,year] = btn.dataset.k.split("|");
        await api("/delete-selected",{method:"POST",body:JSON.stringify({member_id,year:Number(year)})});
        await loadDashboard();
      }

      if (btn.dataset.action === "send-one") {
        const [member_id,year] = btn.dataset.k.split("|");
        await api("/email/send-one",{method:"POST",body:JSON.stringify({member_id,year:Number(year)})});
        alert("送信完了");
      }

    } catch(e) {
      alert("エラー: " + e.message);
    }
  });

  document.addEventListener("change", e=>{
    const chk = e.target.closest("input[type=checkbox]");
    if (!chk) return;
    const k = chk.dataset.k;
    chk.checked ? selected.add(k) : selected.delete(k);
    selCountEl.textContent = selected.size;
  });

  yearEl.value = new Date().getFullYear() - 1;
  loadDashboard();
})();
</script>
</body>
</html>

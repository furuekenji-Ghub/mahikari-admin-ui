<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Receipt Admin / レシート管理</title>
  <style>
    :root{
      --bg:#f7f9fb;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --line2:#eef2f7;
      --accent:#0b5;
      --danger:#dc2626;
      --warn:#d97706;
      --shadow: 0 10px 24px rgba(17,24,39,.08);
      --radius:14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:var(--sans); background:var(--bg); color:var(--text); }
    .wrap{ max-width:1280px; margin:0 auto; padding:18px 16px 40px; }
    .header{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:16px;
      margin-bottom:14px;
    }
    h1{ margin:0; font-size:20px; }
    .sub{ margin-top:6px; color:var(--muted); font-size:13px; line-height:1.4; }
    .back{ display:inline-block; margin-top:10px; font-size:13px; color:var(--accent); text-decoration:none; font-weight:800; }
    .back:hover{ text-decoration:underline; }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
      margin-bottom:14px;
    }
    .cardHead{
      padding:14px 14px 10px;
      border-bottom:1px solid var(--line2);
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      background:linear-gradient(180deg,#fff,#fbfdff);
    }
    .cardHead h2{ margin:0; font-size:16px; }
    .cardBody{ padding:14px; }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:flex-end;
    }
    label{
      font-size:12px;
      color:var(--muted);
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    input[type="number"], input[type="text"]{
      padding:9px 10px;
      border-radius:10px;
      border:1px solid var(--line);
      font-size:14px;
      background:#fff;
      outline:none;
      min-width:140px;
    }
    input[type="text"]{ min-width:280px; }
    input:focus{
      border-color: rgba(11,187,85,.55);
      box-shadow: 0 0 0 4px rgba(11,187,85,.10);
    }

    .btn{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--accent);
      background:#fff;
      color:var(--accent);
      font-weight:900;
      font-size:13px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      user-select:none;
    }
    .btn:hover{ background:#f0fff8; }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }
    .btn.secondary{ border-color:#c7ceda; color:#475569; }
    .btn.secondary:hover{ background:#f8fafc; }
    .btn.danger{ border-color:rgba(220,38,38,.45); color:rgba(220,38,38,.95); }
    .btn.danger:hover{ background:rgba(220,38,38,.04); }

    .note{ color:var(--muted); font-size:12px; line-height:1.4; margin-top:8px; }

    .errorBox{
      border:1px solid rgba(220,38,38,.22);
      background: rgba(220,38,38,.06);
      color: rgba(127,29,29,.95);
      border-radius:14px;
      padding:12px;
      font-size:13px;
      line-height:1.4;
      margin-top:10px;
      display:none;
    }
    .errorBox .notfound{ color:#b91c1c; font-weight:900; }
    .errorBox .link{ color:#b91c1c; font-weight:900; text-decoration:underline; }

    .progressWrap{ display:none; margin-top:10px; }
    .bar{ height:10px; border-radius:999px; background:#eef2f7; overflow:hidden; border:1px solid var(--line); }
    .bar > div{ height:100%; width:0%; background:linear-gradient(90deg, rgba(11,187,85,.95), rgba(5,150,105,.85)); transition: width .2s ease; }
    .progressText{ margin-top:8px; font-size:12px; color:var(--muted); }

    .toolbar{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      margin-bottom:10px;
    }
    .kpiRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      color:var(--muted);
      font-size:12px;
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      white-space:nowrap;
    }
    .mono{ font-family:var(--mono); }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:14px;
    }
    th, td{
      padding:10px 10px;
      border-bottom:1px solid var(--line2);
      vertical-align:top;
    }
    th{
      text-align:left;
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.3px;
      background:#fbfdff;
      position:sticky;
      top:0;
      z-index:1;
    }
    .status{
      display:inline-flex;
      padding:3px 8px;
      border-radius:999px;
      border:1px solid var(--line);
      font-size:12px;
      font-weight:900;
      color:var(--muted);
      background:#fff;
      white-space:nowrap;
    }
    .status.done{ border-color:rgba(22,163,74,.25); color:rgba(22,163,74,.95); background:rgba(22,163,74,.06); }
    .status.err{ border-color:rgba(220,38,38,.25); color:rgba(220,38,38,.95); background:rgba(220,38,38,.07); }
    .status.pending{ border-color:rgba(217,119,6,.25); color:rgba(217,119,6,.95); background:rgba(217,119,6,.07); }

    .pdfLink{
      color:var(--accent);
      font-weight:900;
      text-decoration:underline;
      cursor:pointer;
      white-space:nowrap;
    }

    /* Branch tabs (bottom) */
    .tabsWrap{
      margin-top:12px;
      border-top:1px solid var(--line2);
      padding-top:10px;
    }
    .tabs{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    .tab{
      padding:8px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      cursor:pointer;
      font-size:13px;
      font-weight:900;
      color:#334155;
      user-select:none;
    }
    .tab.active{
      border-color: rgba(11,187,85,.55);
      box-shadow: 0 0 0 4px rgba(11,187,85,.10);
      color:#0a7a3f;
    }

    .toast{
      position:fixed;
      right:16px;
      bottom:16px;
      max-width: 520px;
      z-index:9999;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .toastItem{
      border-radius:14px;
      padding:12px 12px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.96);
      box-shadow: var(--shadow);
      color:var(--text);
      display:flex; gap:10px; align-items:flex-start; justify-content:space-between;
    }
    .toastItem .msg{ font-size:13px; line-height:1.25; }
    .toastItem .x{ background:transparent; border:0; color:var(--muted); cursor:pointer; font-size:16px; padding:0 6px; }

    @media (max-width: 768px){
      input[type="number"], input[type="text"], .btn { width:100%; }
      .toolbar{ align-items:stretch; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="header">
      <h1>レシート管理</h1>
      <div class="sub">
        CSVをアップロードすると、内容を確認したうえでPDFを自動生成します<br>
        完了後、一覧が自動で再表示されます
      </div>
      <a class="back" href="/">← ダッシュボードへ戻る</a>
    </div>

    <!-- Filters -->
    <div class="card">
      <div class="cardHead">
        <h2>検索・表示</h2>
        <div class="row">
          <button class="btn secondary" id="reloadBtn">一覧を再読込</button>
        </div>
      </div>
      <div class="cardBody">
        <div class="row">
          <label>年度
            <input type="number" id="year" min="2000" max="2100" step="1">
          </label>
          <label>検索（氏名 / 会員ID）
            <input type="text" id="q" placeholder="例）TEST-0001 / Tanaka">
          </label>
        </div>
        <div class="note">※ 表示対象は選択した年度のレシートです</div>
      </div>
    </div>

    <!-- Upload -->
    <div class="card">
      <div class="cardHead">
        <h2>CSVアップロード</h2>
        <div class="row">
          <button class="btn" id="uploadBtn" disabled>アップロード → 自動生成</button>
        </div>
      </div>
      <div class="cardBody">
        <div class="row">
          <label>CSVファイル
            <input type="file" id="file" accept=".csv,text/csv">
          </label>
        </div>
        <div class="note">
          CSV形式：<span class="mono">member_id,branch,amount,year</span><br>
          事前チェック：会員IDの欠け／HubSpot側のメール未登録（または会員不在）
        </div>

        <div class="errorBox" id="errors"></div>

        <div class="progressWrap" id="progressWrap">
          <div class="bar"><div id="barFill"></div></div>
          <div class="progressText" id="progressText">—</div>
        </div>
      </div>
    </div>

    <!-- Dashboard -->
    <div class="card">
      <div class="cardHead">
        <h2>一覧（生成結果）</h2>
        <div class="row">
          <button class="btn secondary" id="allBranchBtn">全Branch</button>
          <button class="btn" id="sendBulkBtn" disabled>メール一括送信（準備中）</button>
        </div>
      </div>

      <div class="cardBody">

        <div class="toolbar">
          <div class="kpiRow">
            <span class="pill">件数 <span class="mono" id="kpiRows">—</span></span>
            <span class="pill">完了 <span class="mono" id="kpiDone">—</span></span>
            <span class="pill">未完了 <span class="mono" id="kpiPending">—</span></span>
            <span class="pill">エラー <span class="mono" id="kpiError">—</span></span>
            <span class="pill">合計 <span class="mono" id="kpiAmount">—</span></span>
          </div>
        </div>

        <div style="overflow:auto; border:1px solid var(--line2); border-radius:12px; max-height:520px;">
          <table>
            <thead>
              <tr>
                <th style="width:10%;">Send</th>
                <th style="width:12%;">Member ID</th>
                <th style="width:18%;">Name</th>
                <th style="width:10%;">Branch</th>
                <th style="width:10%;">Year</th>
                <th style="width:12%;">Amount</th>
                <th style="width:12%;">Status</th>
                <th style="width:16%;">PDF</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>

        <div class="tabsWrap">
          <div class="muted" style="font-size:12px; margin-bottom:6px;">Branchタブ：</div>
          <div class="tabs" id="tabs"></div>
        </div>

      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

<script>
(() => {
  const API = "/api/admin/receipt";

  const el = (id) => document.getElementById(id);

  const yearEl = el("year");
  const qEl = el("q");
  const reloadBtn = el("reloadBtn");

  const fileEl = el("file");
  const uploadBtn = el("uploadBtn");
  const errorsEl = el("errors");

  const progressWrapEl = el("progressWrap");
  const barFillEl = el("barFill");
  const progressTextEl = el("progressText");

  const tbodyEl = el("tbody");
  const tabsEl = el("tabs");
  const allBranchBtn = el("allBranchBtn");

  const kpiRowsEl = el("kpiRows");
  const kpiDoneEl = el("kpiDone");
  const kpiPendingEl = el("kpiPending");
  const kpiErrorEl = el("kpiError");
  const kpiAmountEl = el("kpiAmount");

  const sendBulkBtn = el("sendBulkBtn");

  let selectedFile = null;
  let allRows = [];
  let selectedBranch = "ALL";

  function toast(msg, type="info", ttl=5200){
    const t = el("toast");
    const item = document.createElement("div");
    item.className = "toastItem";
    const left = document.createElement("div");
    left.className = "msg";
    left.textContent = msg;

    const x = document.createElement("button");
    x.className = "x";
    x.textContent = "×";
    x.onclick = () => item.remove();

    item.appendChild(left);
    item.appendChild(x);

    if (type === "ok") item.style.borderColor = "rgba(22,163,74,.25)";
    if (type === "warn") item.style.borderColor = "rgba(217,119,6,.25)";
    if (type === "bad") item.style.borderColor = "rgba(220,38,38,.25)";
    t.appendChild(item);

    setTimeout(() => item.remove(), ttl);
  }

  function setBusy(btn, busy, label){
    btn.disabled = !!busy;
    if (busy && label) { btn.dataset._label = btn.textContent; btn.textContent = label; }
    if (!busy && btn.dataset._label) { btn.textContent = btn.dataset._label; delete btn.dataset._label; }
  }

  function showErrors(html){
    errorsEl.style.display = "block";
    errorsEl.innerHTML = html;
  }
  function clearErrors(){
    errorsEl.style.display = "none";
    errorsEl.innerHTML = "";
  }

  function showProgress(show){
    progressWrapEl.style.display = show ? "block" : "none";
  }
  function updateProgress(job){
    const total = Number(job?.total_rows ?? 0);
    const processed = Number(job?.processed_rows ?? 0);
    const ok = Number(job?.ok_rows ?? 0);
    const ng = Number(job?.ng_rows ?? 0);
    const status = String(job?.status ?? "—");
    const pct = total > 0 ? Math.min(100, Math.round((processed/total)*100)) : 0;
    barFillEl.style.width = pct + "%";
    progressTextEl.textContent = `処理中：${processed}/${total}（OK:${ok} / NG:${ng}） 状態:${status}`;
  }

  function escapeHtml(str){
    return String(str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function fmtInt(n){
    if (n == null || isNaN(Number(n))) return "—";
    return Number(n).toLocaleString("en-US");
  }
  function fmtMoneyFromCents(cents){
    if (cents == null || isNaN(Number(cents))) return "—";
    const v = Number(cents) / 100;
    return v.toLocaleString("en-US", { style:"currency", currency:"USD" });
  }

  async function apiFetch(path, opts={}){
    const res = await fetch(API + path, { credentials:"include", ...opts, headers:{...(opts.headers||{})} });
    const ct = res.headers.get("content-type") || "";
    const isJson = ct.includes("application/json");
    const body = isJson ? await res.json().catch(()=>null) : await res.text().catch(()=> "");
    if (!res.ok) {
      const detail = body?.error ? body.error : (typeof body === "string" ? body : JSON.stringify(body));
      throw new Error(`HTTP ${res.status} — ${detail}`);
    }
    return body;
  }

  function statusBadge(s){
    const up = String(s||"").toUpperCase();
    if (up === "DONE") return `<span class="status done">DONE</span>`;
    if (up === "ERROR") return `<span class="status err">ERROR</span>`;
    return `<span class="status pending">${escapeHtml(up || "PENDING")}</span>`;
  }

  function computeKpi(rows){
    let done=0, pending=0, err=0, sum=0;
    for (const r of rows) {
      const s = String(r.status||"").toUpperCase();
      if (s === "DONE") done++;
      else if (s === "ERROR") err++;
      else pending++;
      if (!isNaN(Number(r.amount_cents))) sum += Number(r.amount_cents);
    }
    kpiRowsEl.textContent = fmtInt(rows.length);
    kpiDoneEl.textContent = fmtInt(done);
    kpiPendingEl.textContent = fmtInt(pending);
    kpiErrorEl.textContent = fmtInt(err);
    kpiAmountEl.textContent = fmtMoneyFromCents(sum);
  }

  function applyFilter(rows){
    const q = qEl.value.trim().toLowerCase();
    let out = rows;

    if (selectedBranch !== "ALL") out = out.filter(r => String(r.branch||"") === selectedBranch);

    if (q) {
      out = out.filter(r =>
        String(r.member_id||"").toLowerCase().includes(q) ||
        String(r.name||"").toLowerCase().includes(q)
      );
    }
    return out;
  }

  function buildTabs(rows){
    const branches = Array.from(new Set(rows.map(r => String(r.branch||"UNKNOWN")))).sort((a,b)=>a.localeCompare(b));
    tabsEl.innerHTML = "";

    const makeTab = (label, value) => {
      const btn = document.createElement("button");
      btn.className = "tab" + (selectedBranch === value ? " active" : "");
      btn.textContent = label;
      btn.onclick = () => { selectedBranch = value; buildTabs(allRows); render(); };
      return btn;
    };

    tabsEl.appendChild(makeTab("All", "ALL"));
    for (const b of branches) tabsEl.appendChild(makeTab(b, b));
  }

  function render(){
    const rows = applyFilter(allRows);
    computeKpi(rows);

    // Email buttons are UI-only for now (API not yet implemented)
    sendBulkBtn.disabled = true;

    tbodyEl.innerHTML = "";
    if (rows.length === 0) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="8" class="muted" style="padding:14px;">表示するデータがありません</td>`;
      tbodyEl.appendChild(tr);
      return;
    }

    for (const r of rows) {
      const memberId = String(r.member_id||"").trim();
      const year = String(r.year||"").trim();

      const tr = document.createElement("tr");

      const oneBtn = `<button class="btn secondary" data-action="sendOne" data-mid="${escapeHtml(memberId)}" data-year="${escapeHtml(year)}" disabled>送信（準備中）</button>`;

      const pdf = r.pdf_key
        ? `<a class="pdfLink" href="/api/admin/receipt/pdf?member_id=${encodeURIComponent(memberId)}&year=${encodeURIComponent(year)}" target="_blank" rel="noopener">PDF</a>`
        : "—";

      tr.innerHTML = `
        <td>${oneBtn}</td>
        <td class="mono">${escapeHtml(memberId || "—")}</td>
        <td>${escapeHtml(String(r.name||"—"))}</td>
        <td>${escapeHtml(String(r.branch||"—"))}</td>
        <td class="mono">${escapeHtml(String(r.year||"—"))}</td>
        <td>${escapeHtml(fmtMoneyFromCents(r.amount_cents))}</td>
        <td>${statusBadge(r.status)}</td>
        <td>${pdf}</td>
      `;

      tbodyEl.appendChild(tr);
    }
  }

  async function loadDashboard(){
    const y = Number(yearEl.value);
    if (!y || isNaN(y)) throw new Error("年度が不正です");

    const data = await apiFetch(`/dashboard?year=${encodeURIComponent(y)}`, { method:"GET" });
    allRows = Array.isArray(data?.rows) ? data.rows : [];
    buildTabs(allRows);
    render();
  }

  function buildValidateHtml(errors){
    const missingIds = errors.filter(e => e.type === "MISSING_MEMBER_ID");
    const missingEmails = errors.filter(e => e.type === "MISSING_EMAIL");

    let html = `<div style="font-weight:900; margin-bottom:6px;">以下の理由により、CSVをアップロードできません</div>`;

    if (missingIds.length) {
      html += `<div style="margin-top:8px; font-weight:900;">会員ID（member_id）が未入力の行があります</div>`;
      html += `<div style="margin-top:6px;">`;
      for (const e of missingIds) html += `・${escapeHtml(e.row)}行目：会員ID（member_id）が入力されていません<br>`;
      html += `</div>`;
    }

    if (missingEmails.length) {
      html += `<div style="margin-top:12px; font-weight:900;">HubSpotにメールアドレスが登録されていない会員があります</div>`;
      html += `<div style="margin-top:6px;">`;
      for (const e of missingEmails) {
        const mid = escapeHtml(e.member_id || "");
        const row = escapeHtml(e.row || "");
        const name = String(e.name || "");
        const isNotFound = (name === "(HubSpot not found)");

        html += `・${row}行目：ID「${mid}」<br>`;
        if (isNotFound) {
          html += `　<span class="notfound">HubSpotに該当する会員が見つかりません</span><br>`;
        } else {
          html += `　${escapeHtml(name)} さんのメールアドレスが未登録です<br>`;
        }
        html += `　→ <a class="link" href="https://app.hubspot.com/contacts" target="_blank" rel="noopener">HubSpotで確認する</a><br><br>`;
      }
      html += `</div>`;
    }

    html += `<div style="margin-top:8px;">CSVの内容を修正、またはHubSpot側を整備してから、再度アップロードしてください。</div>`;
    return html;
  }

  async function validateCsv(csvText){
    const res = await fetch(API + "/import/validate", {
      method:"POST",
      headers:{ "Content-Type":"text/csv" },
      body: csvText,
      credentials:"include"
    });
    const data = await res.json().catch(()=>null);
    if (!res.ok) throw new Error(data?.error || `validate_failed: HTTP ${res.status}`);
    if (!data || data.ok !== true) return { ok:false, data };
    return { ok:true, data };
  }

  async function importAndAutoRun(csvText){
    showProgress(true);
    barFillEl.style.width = "0%";
    progressTextEl.textContent = "アップロード中…";

    const importRes = await fetch(API + "/import", {
      method:"POST",
      headers:{ "Content-Type":"text/csv" },
      body: csvText,
      credentials:"include"
    });
    const importData = await importRes.json().catch(()=>null);
    if (!importRes.ok) throw new Error(importData?.error || `import_failed: HTTP ${importRes.status}`);

    const jobId = importData?.job_id;
    const year = importData?.year;
    if (!jobId) throw new Error("import_failed: job_id_not_returned");

    let safety = 0;
    while (true) {
      safety++;
      if (safety > 500) throw new Error("auto_continue_safety_stop");

      const cont = await apiFetch(`/import/continue?job_id=${encodeURIComponent(jobId)}&batch=50`, { method:"POST" });

      const job = cont?.job; // your Worker returns { ok:true, job: updated, ... }
      if (job) updateProgress(job);

      const status = String(job?.status || "").toUpperCase();
      if (status === "ERROR") {
        toast("取込中にエラーが発生しました。一覧でERROR行をご確認ください。", "bad", 9000);
        break;
      }
      if (status === "DONE") {
        toast("自動生成が完了しました。一覧を更新します。", "ok", 7000);
        if (year) yearEl.value = String(year);
        await loadDashboard();

        selectedBranch = "ALL"; // 全表示
        buildTabs(allRows);
        render();

        showProgress(false);
        break;
      }

      await new Promise(r => setTimeout(r, 350));
    }
  }

  // Events
  reloadBtn.onclick = async () => {
    try{ await loadDashboard(); toast("一覧を更新しました。", "ok"); }
    catch(e){ toast(`更新に失敗しました：${e.message}`, "bad", 9000); }
  };
  qEl.oninput = () => render();
  allBranchBtn.onclick = () => { selectedBranch = "ALL"; buildTabs(allRows); render(); };

  fileEl.onchange = () => {
    selectedFile = (fileEl.files && fileEl.files[0]) ? fileEl.files[0] : null;
    uploadBtn.disabled = !selectedFile;
    clearErrors();
    showProgress(false);
  };

  uploadBtn.onclick = async () => {
    if (!selectedFile) return;
    clearErrors();
    setBusy(uploadBtn, true, "確認中…");
    try{
      const csvText = await selectedFile.text();

      const v = await validateCsv(csvText);
      if (!v.ok) {
        const errors = v.data?.errors || [];
        showErrors(buildValidateHtml(errors));
        toast("アップロードできません（事前チェックで問題が見つかりました）", "bad", 9000);
        return;
      }

      toast("事前チェックOK。自動生成を開始します。", "ok");
      setBusy(uploadBtn, true, "生成中…");
      await importAndAutoRun(csvText);

    }catch(e){
      toast(`処理に失敗しました：${e.message}`, "bad", 9000);
    }finally{
      setBusy(uploadBtn, false);
    }
  };

  // Boot
  (async function init(){
    const now = new Date();
    yearEl.value = String(now.getFullYear());

    // pick latest year with data (thisYear down to -3)
    const candidates = [now.getFullYear(), now.getFullYear()-1, now.getFullYear()-2, now.getFullYear()-3];
    for (const y of candidates) {
      try{
        const data = await apiFetch(`/dashboard?year=${encodeURIComponent(y)}`, { method:"GET" });
        const rows = Array.isArray(data?.rows) ? data.rows : [];
        if (rows.length > 0) { yearEl.value = String(y); break; }
      }catch(_){}
    }

    try{ await loadDashboard(); }
    catch(e){ toast("一覧の読み込みに失敗しました。Accessログイン後、再読込してください。", "warn", 9000); }
  })();

})();
</script>
</body>
</html>
